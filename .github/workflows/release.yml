name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 的 Tag 名称 (例如 v1.0.0)'
        required: true
        type: string

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Prepare ksud files
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ] && [ -f "$dir/ksud" ]; then
              platform=$(basename "$dir" | sed 's/^ksud-//')
              mv "$dir/ksud" "ksud/$platform"
            fi
          done

      - name: Prepare LKM files
        run: |
          mkdir -p lkm
          for dir in ./*-lkm; do
            if [ -d "$dir" ]; then
              arch=$(basename "$dir" | cut -d'-' -f1)
              mkdir -p "lkm/$arch"
              for ko in "$dir"/*.ko; do
                [ -f "$ko" ] && cp "$ko" "lkm/$arch/"
              done
            fi
          done

      - name: Prepare ksuinit files
        run: |
          mkdir -p ksuinit
          [ -f "ksuinit-aarch64/ksuinit" ] && cp "ksuinit-aarch64/ksuinit" "ksuinit/ksuinit-aarch64"
          [ -f "ksuinit-x86_64/ksuinit" ] && cp "ksuinit-x86_64/ksuinit" "ksuinit/ksuinit-x86_64"

      - name: Display structure of downloaded files
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          create_release: true
          files: |
            manager/*.apk
            lkm/**/*.ko
            ksud/*
            ksuinit/*